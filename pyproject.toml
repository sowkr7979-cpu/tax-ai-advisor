[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiw"
version = "0.1.0"
description = "Tax Intelligence Workspace (TIW) — Korean corporate-tax advisory AI (Workpaper-2120 layout)"
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TIW build agent" }]

# Core runtime deps. Kept intentionally minimal so the DETERMINISTIC slice-6
# harness + the contract invariants run with NO real API keys and NO heavy
# native wheels (see docs/PROMPT.md: "slice⑥ 결정적 테스트는 실키 없이 통과").
dependencies = [
  "pydantic>=2.7",   # contract schemas + 3 invariants (runtime enforced)
  "pyyaml>=6.0",     # infra/config vendor config loading
]

[project.optional-dependencies]
# Web API surface (FastAPI app is a thin wiring layer over src/).
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]
# Real external adapters (src/ai/*). Slices ①/⑥ need NONE of these (deterministic
# fakes/fallbacks). Slice ② REPLAY needs `chromadb` (the vector engine — there is
# no fake Chroma; slice⑥ uses src.vector_store instead) but NOT `model2vec`/torch
# (embeddings replay from tests/fixtures/embeddings/). `model2vec` is needed ONLY
# to RECORD those embedding fixtures (scripts/record_rag_fixtures.py).
adapters = [
  "anthropic>=0.40",   # LLM — default model claude-opus-4-8
  "chromadb>=0.5",     # local embedded vector DB (behind src/ai adapter)
  "model2vec>=0.3",    # slice ② local on-prem static multilingual embedder (record only)
  "httpx>=0.27",       # tavily / brave / dart / korean-law-mcp HTTP clients
  "python-docx>=1.1",  # DOCX review package
  "requests>=2.31",    # slice ① 법제처 DRF + slice ③ Tavily live recording (lazy; replay uses stdlib)
  "python-dotenv>=1.0",  # load LAW_OC / TAVILY_API_KEY / API keys from .env (record path only)
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
tiw-eval = "tiw.eval.__main__:main"

# Workpaper-2120 layout: deterministic packages live at repo root
# (contract/, src/, src/ai/, rules/) and are importable alongside the tiw/
# orchestration+eval package. Runtime data (runs/, logs/, .chroma/) is NOT source.
[tool.setuptools]
packages = [
  "tiw",
  "tiw.eval",
  "tiw.eval.slices",
  "contract",
  "src",
  "src.ai",
  "rules",
]

[tool.setuptools.package-data]
"tiw.eval" = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
